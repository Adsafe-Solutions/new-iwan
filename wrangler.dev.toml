# DEVELOPMENT. Deployed by `npm run deploy:dev`, or by a push to `develop`
# in .github/workflows/deploy.yaml.
#
# A separate Worker, not a Cloudflare "environment": two names keep the two
# deployments completely independent, which is what the reference project does.
name = "iwan-community-dev"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

