# DEVELOPMENT. `npm run deploy:dev`, or a push to `develop`.
#
# A separate Worker, not a Cloudflare "environment": two names keep the two
# deployments completely independent, which is what the reference project does.
name = "iwan-community-dev"
main = "worker/index.js"
account_id = "655eda9ca541b4af737153f0f1ea6966"
compatibility_date = "2024-11-01"

# ⚠ Must stay above [assets] — see the note in wrangler.toml.
routes = [
  { pattern = "dev.iwan.community", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[vars]
CMS_API_URL = "https://iwan-cms-api.onrender.com"
# ⚠ The Worker verifies Turnstile against this hostname. It is NOT the
# VITE_ build variable — those are inlined into the browser bundle and
# never reach the Worker at runtime.
SITE_URL = "https://dev.iwan.community"
VITE_CMS_API_URL = "https://iwan-cms-api.onrender.com"
