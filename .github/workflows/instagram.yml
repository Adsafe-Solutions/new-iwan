name: Refresh Instagram feed

# Pulls the latest posts into src/content/base/instagram-feed.json and commits the
# result, so the site stays fully static and never calls Instagram at runtime.
#
# Repository secrets required (Settings → Secrets and variables → Actions):
#   IG_USER_ID_IN / IG_ACCESS_TOKEN_IN  India professional account credentials
#   IG_USER_ID_CA / IG_ACCESS_TOKEN_CA  Canada professional account credentials
#
# Optional secret:
#   GH_PAT           a fine-grained PAT with "Secrets: read and write" on this
#                    repo. Without it the token cannot be rotated automatically
#                    and will expire after ~60 days; the rotate job then just
#                    warns instead.

on:
  schedule:
    - cron: "17 4 * * *" # daily, off the hour to dodge peak scheduling
  workflow_dispatch: # so it can be run by hand after setting the secrets

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - region: in
            feed_file: src/content/base/instagram-feed.json
          - region: ca
            feed_file: src/content/ca/instagram-feed.json
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch latest ${{ matrix.region }} posts
        env:
          IG_USER_ID: ${{ matrix.region == 'ca' && secrets.IG_USER_ID_CA || secrets.IG_USER_ID_IN }}
          IG_ACCESS_TOKEN: ${{ matrix.region == 'ca' && secrets.IG_ACCESS_TOKEN_CA || secrets.IG_ACCESS_TOKEN_IN }}
          IG_FEED_FILE: ${{ matrix.feed_file }}
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::warning::Instagram credentials for ${{ matrix.region }} are not configured; keeping the existing feed."
            exit 0
          fi
          node scripts/fetch-instagram.mjs

      - name: Commit if the feed changed
        run: |
          if git diff --quiet -- "${{ matrix.feed_file }}"; then
            echo "Feed unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.feed_file }}"
          git commit -m "chore: refresh ${{ matrix.region }} Instagram feed"
          git pull --rebase
          git push

  rotate-token:
    # Long-lived tokens last ~60 days. Refreshing returns a NEW token that has
    # to be stored, so this runs weekly and writes it back as a secret.
    needs: feed
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: [IN, CA]
    steps:
      - name: Refresh the long-lived token
        env:
          IG_ACCESS_TOKEN: ${{ matrix.region == 'CA' && secrets.IG_ACCESS_TOKEN_CA || secrets.IG_ACCESS_TOKEN_IN }}
          SECRET_NAME: IG_ACCESS_TOKEN_${{ matrix.region }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::warning::$SECRET_NAME is not configured; skipping rotation."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT is not set, so $SECRET_NAME cannot be rotated automatically. Rotate it by hand before expiry."
            exit 0
          fi
          NEW=$(curl -sS -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);if(!j.access_token){console.error(d);process.exit(1)}process.stdout.write(j.access_token)})")
          # mask before it can reach a log line
          echo "::add-mask::$NEW"
          gh secret set "$SECRET_NAME" --body "$NEW" --repo "${{ github.repository }}"
          echo "Token rotated."
