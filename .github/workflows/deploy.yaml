# Deploys the built site to Cloudflare Workers static assets.
#
#   push to develop  → the dev Worker  (wrangler.dev.toml)
#   push of a v* tag → the prod Worker (wrangler.toml)
#
# Environment files are SOPS-encrypted in Git and decrypted only inside the
# deployment runner. TURNSTILE_SECRET_KEY must never be renamed to a VITE_ key
# or otherwise included in the public browser bundle.
name: Deploy to Cloudflare

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Which Worker to deploy
        type: choice
        options: [dev, prod]
        default: dev

jobs:
  deploy:
    name: Deploy Worker (${{ startsWith(github.ref, 'refs/tags/') && 'prod' || inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    env:
      IS_PROD: ${{ startsWith(github.ref, 'refs/tags/') }}
      ENV_NAME: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # -------- SOPS + GPG (shared) --------
      - name: Setup SOPS
        shell: bash
        env:
          SOPS_VERSION: 3.13.3
        run: |
          file="sops-v${SOPS_VERSION}.linux.amd64"
          base="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}"
          curl --fail --silent --show-error --location --output "$file" "$base/$file"
          curl --fail --silent --show-error --location \
            --output sops-checksums.txt "$base/sops-v${SOPS_VERSION}.checksums.txt"
          grep "  $file$" sops-checksums.txt | sha256sum --check --strict
          sudo install --mode 0755 "$file" /usr/local/bin/sops

      - name: Import deployment GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}

      - name: Checkout GPG key repository
        uses: actions/checkout@v6
        with:
          repository: Adsafe-Solutions/gpg
          ref: main
          path: gpg
          token: ${{ secrets.GIT_TOKEN }}
          persist-credentials: false

      - name: Import shared GPG keys
        shell: bash
        run: gpg --import gpg/*.asc || test $? -eq 2

      - name: Decrypt environment file
        shell: bash
        run: |
          if [ "${ENV_NAME}" = "prod" ]; then
            sops --decrypt --in-place .env.production
          else
            sops --decrypt --in-place .env.development
          fi
      # -------------------------------------

      - name: Install dependencies
        run: npm ci

      # the build is what bakes in .env.<mode>, so it has to happen per
      # environment — a single build cannot serve both
      - name: Build (${{ env.ENV_NAME }})
        run: npm run build:${{ env.ENV_NAME }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy --config
            ${{ env.ENV_NAME == 'prod' && 'wrangler.toml' || 'wrangler.dev.toml' }}
