# Deploys the built site to Cloudflare Workers static assets.
#
#   push to develop → the dev Worker  (wrangler.dev.toml → dev.iwan.community)
#   push to main    → the prod Worker (wrangler.toml     → new.iwan.community)
#
# ⚠ main deploys to production on every push. There is no tag or approval gate,
# so a merge to main is a release. That is low-risk while prod points at
# new.iwan.community; once the route moves to www.iwan.community it means every
# push to main goes straight to the live site — worth adding a GitHub
# environment with a required reviewer before that happens.
#
# There is no SOPS step, unlike the reference project: nothing this site builds
# with is secret. Every VITE_* value is inlined into a public bundle, so
# .env.development and .env.production are committed in the clear. If a real
# secret ever appears it must NOT become a VITE_ key — it belongs in a
# repository secret and in whatever runs server-side.
name: Deploy to Cloudflare

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Which Worker to deploy
        type: choice
        options: [dev, prod]
        default: dev

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'prod' || inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    env:
      ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # the build is what bakes in .env.<mode>, so it has to happen per
      # environment — a single build cannot serve both
      - name: Build (${{ env.ENV_NAME }})
        run: npm run build:${{ env.ENV_NAME }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ⚠ Pin to the version this repo is built against. Left alone the
          # action installs its own default (3.90.0 as of writing) and ignores
          # the devDependency, which is a different major line to the one the
          # wrangler.toml files were written and tested for.
          wranglerVersion: "4.125.0"
          command: >-
            deploy --config
            ${{ env.ENV_NAME == 'prod' && 'wrangler.toml' || 'wrangler.dev.toml' }}
