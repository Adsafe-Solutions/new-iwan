# Deploys the built site to Cloudflare Workers static assets.
#
#   push to develop  → the dev Worker  (wrangler.dev.toml)
#   push of a v* tag → the prod Worker (wrangler.toml)
#
# There is no SOPS step, unlike the reference project: nothing this site builds
# with is secret. Every VITE_* value is inlined into a public bundle, so
# .env.development and .env.production are committed in the clear. If a real
# secret ever appears it must NOT become a VITE_ key — it belongs in a
# repository secret and in whatever runs server-side.
name: Deploy to Cloudflare

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Which Worker to deploy
        type: choice
        options: [dev, prod]
        default: dev

jobs:
  deploy:
    name: Deploy ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    env:
      ENV_NAME: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # the build is what bakes in .env.<mode>, so it has to happen per
      # environment — a single build cannot serve both
      - name: Build (${{ env.ENV_NAME }})
        run: npm run build:${{ env.ENV_NAME }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy --config
            ${{ env.ENV_NAME == 'prod' && 'wrangler.toml' || 'wrangler.dev.toml' }}
